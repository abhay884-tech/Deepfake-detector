[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-detector"
version = "1.0.0"
description = "Deepfake image and video detection with EfficientNet (PyTorch)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "torch>=2.3", "torchvision>=0.18", "numpy>=1.24", "opencv-python>=4.8",
  "Pillow>=10.0", "scikit-learn>=1.3", "matplotlib>=3.7", "tqdm>=4.66",
]

[project.optional-dependencies]
app = ["gradio>=4.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
